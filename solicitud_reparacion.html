<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Reparación - MasterBikes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">MasterBikes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                    <li class="nav-item hide-on-login"> 
                        <a class="nav-link" href="login.html">Iniciar Sesión</a>
                    </li>
                    <li class="nav-item hide-on-login"> 
                        <a class="nav-link" href="register.html">Registrarse</a>
                    </li>
                    <li class="nav-item show-on-login" style="display: none;"> 
                        <a class="nav-link" href="#" onclick="cerrarSesion()">Cerrar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container my-5">
        <h2 class="text-center mb-4">Solicitar Reparación de Bicicleta</h2>
        <form id="solicitudForm" onsubmit="guardarDatos(event)">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="tipoBicicleta" class="form-label">Tipo de Bicicleta</label>
                <select class="form-control" id="tipoBicicleta" required>
                    <option value="">Selecciona el tipo de bicicleta</option>
                    <option value="Montaña">Montaña</option>
                    <option value="Carretera">Carretera</option>
                    <option value="Ciudad">Ciudad</option>
                    <option value="BMX">BMX</option>
                    <option value="Eléctrica">Eléctrica</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fecha" required>
            </div>
            <div class="mb-3">
                <label for="hora" class="form-label">Hora</label>
                <select class="form-control" id="hora" required>
                    <option value="09:00">09:00</option>
                    <option value="09:30">09:30</option>
                    <option value="10:00">10:00</option>
                    <option value="10:30">10:30</option>
                    <option value="11:00">11:00</option>
                    <option value="11:30">11:30</option>
                    <option value="12:00">12:00</option>
                    <option value="12:30">12:30</option>
                    <option value="13:00">13:00</option>
                    <option value="13:30">13:30</option>
                    <option value="14:00">14:00</option>
                    <option value="14:30">14:30</option>
                    <option value="15:00">15:00</option>
                    <option value="15:30">15:30</option>
                    <option value="16:00">16:00</option>
                    <option value="16:30">16:30</option>
                    <option value="17:00">17:00</option>
                    <option value="17:30">17:30</option>
                    <option value="18:00">18:00</option>
                    <option value="18:30">18:30</option>
                    <option value="19:00">19:00</option>
                    <option value="19:30">19:30</option>
                    <option value="20:00">20:00</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción del Problema</label>
                <textarea class="form-control" id="descripcion" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
        </form>
    </div>

    <footer class="bg-dark text-white text-center py-4">
        <p>&copy; 2024 MasterBikes. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sesionActiva = localStorage.getItem('sesionActiva');

            if (sesionActiva === 'true') {
                const username = localStorage.getItem('username');
                const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
                const usuario = usuarios.find(user => user.username === username);

                if (usuario) {
                    document.getElementById('nombre').value = usuario.nombre;
                    document.getElementById('email').value = usuario.email;
                }

                document.querySelector('.hide-on-login').style.display = 'none';
                const userDropdown = document.querySelector('.show-on-login');
                userDropdown.style.display = 'inline-block';
                userDropdown.querySelector('#username').innerText = username;
            } else {
                window.location.href = 'login.html';
            }
        });

        function guardarDatos(event) {
            event.preventDefault();

            const sesionActiva = localStorage.getItem('sesionActiva');
            if (sesionActiva !== 'true') {
                alert('Debes iniciar sesión para enviar una solicitud de reparación.');
                return;
            }

            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const tipoBicicleta = document.getElementById('tipoBicicleta').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;
            const descripcion = document.getElementById('descripcion').value;

            const solicitud = {
                nombre,
                email,
                tipoBicicleta,
                fecha,
                hora,
                descripcion,
                estado: 'pendiente'
            };

            let solicitudes = JSON.parse(localStorage.getItem('solicitudes')) || [];
            solicitudes.push(solicitud);
            localStorage.setItem('solicitudes', JSON.stringify(solicitudes));

            alert('Solicitud enviada correctamente.');

            window.location.href = 'solicitud_lista.html';
        }

        function cerrarSesion() {
            localStorage.setItem('sesionActiva', 'false');
            localStorage.removeItem('username');
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
