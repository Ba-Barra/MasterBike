<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MasterBikes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">MasterBikes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="solicitud_reparacion.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                    <li class="nav-item hide-on-login"> 
                        <a class="nav-link" href="login.html">Iniciar Sesión</a>
                    </li>
                    <li class="nav-item hide-on-login"> 
                        <a class="nav-link" href="register.html">Registrarse</a>
                    </li>
                    <li class="nav-item show-on-login" style="display: none;"> 
                        <a class="nav-link" href="#">Cerrar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        </form>
    </div>
    <footer class="bg-dark text-white text-center py-4">
        <p>&copy; 2024 MasterBikes. Todos los derechos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sesionActiva = localStorage.getItem('sesionActiva');
            if (sesionActiva === 'true') {
                const buttonsToHide = document.querySelectorAll('.hide-on-login');
                buttonsToHide.forEach(button => {
                    button.style.display = 'none';
                });
                const logoutButton = document.querySelector('.show-on-login');
                if (logoutButton) {
                    logoutButton.style.display = 'inline-block'; 
                }
            }
        });
        document.addEventListener('DOMContentLoaded', function() {
            const sesionActiva = localStorage.getItem('sesionActiva');
            const cerrarSesionButton = document.querySelector('.show-on-login a.nav-link');
            if (cerrarSesionButton) {
                cerrarSesionButton.addEventListener('click', function(event) {
                    event.preventDefault(); 
                    localStorage.setItem('sesionActiva', 'false');
                    const buttonsToShow = document.querySelectorAll('.hide-on-login');
                    buttonsToShow.forEach(button => {
                        button.style.display = 'inline-block';
                    });
                    cerrarSesionButton.closest('.show-on-login').style.display = 'none';
                });
            }
        });
    </script>
</body>
</html>
